set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g base-index 0
set -g mouse on
set -g status-keys vi
setw -g mode-keys vi

set -g prefix C-b
bind-key C-b send-prefix

# Make the active pane obvious: bright blue thick border, dim gray for inactive
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39,bold'
set -g pane-border-lines heavy
# Show pane title bar at top of each pane so the active one is labelled
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=colour39#,bold],#[fg=colour244]}#P: #{pane_current_command} '

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane movements using Alt+hjkl
bind -n M-h swap-pane -s '{left-of}'
bind -n M-j swap-pane -s '{down-of}'
bind -n M-k swap-pane -s '{up-of}'
bind -n M-l swap-pane -s '{right-of}'


# ── Status bar readability ──────────────────────────────
set -g status-style "bg=colour236,fg=colour250"
set -g status-left  " #[bold]#S #[default]"
set -g status-left-length 30

# Auto window name = current dir basename + running command (e.g. "tmux:nvim")
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'

# Inactive windows: dim
set -g window-status-style "fg=colour244,bg=colour236"
set -g window-status-format " #I:#W#F "

# ACTIVE window: bold, bright, colored block — the key readability win
set -g window-status-current-style "fg=colour16,bg=colour39,bold"
set -g window-status-current-format " #I:#W#F "

# Clock/host on the right, bold
set -g status-right "#[bold]#H  %H:%M "
set -g status-right-length 40
set -g status-interval 5

# prefix + v : open current pane's full scrollback in nvim.
# Same pane if it's sitting at a shell prompt; otherwise a new window,
# so the command isn't typed into whatever program is running.
bind-key v capture-pane -S - \; save-buffer /tmp/tmux-scrollback \; if-shell -F '#{m/r:^(bash|zsh|fish|sh|dash)$,#{pane_current_command}}' {
  send-keys 'nvim +$ /tmp/tmux-scrollback' Enter
} {
  new-window -n scrollback 'nvim +$ /tmp/tmux-scrollback'
}

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # use prefix ctrl-s to save and ctrl-r to restore
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
